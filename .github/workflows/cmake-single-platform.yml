# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # ZooKeeper server release used to run the integration tests
  ZK_VERSION: 3.4.14

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      # CppUnit is required to build and run the tests
      run: sudo apt-get update && sudo apt-get install -y libcppunit-dev

    - name: Set up JDK
      # The test suite starts a real ZooKeeper server (Java) via tests/zkServer.sh,
      # so a JDK is required.
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'

    - name: Download ZooKeeper server
      # tests/zkServer.sh expects the server jars in src/java/lib
      run: |
        curl -fsSL -o /tmp/zookeeper.tar.gz \
          https://archive.apache.org/dist/zookeeper/zookeeper-${{env.ZK_VERSION}}/zookeeper-${{env.ZK_VERSION}}.tar.gz
        tar -xzf /tmp/zookeeper.tar.gz -C /tmp
        mkdir -p src/java/lib
        cp /tmp/zookeeper-${{env.ZK_VERSION}}/zookeeper-${{env.ZK_VERSION}}.jar src/java/lib/
        cp /tmp/zookeeper-${{env.ZK_VERSION}}/lib/*.jar src/java/lib/

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Install
      # Install the libraries and binaries into the system prefix.
      run: sudo cmake --install ${{github.workspace}}/build
